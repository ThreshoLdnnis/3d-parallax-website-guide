<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="126" viewBox="0 0 1400 126" role="img" aria-labelledby="title desc">
  <title id="title">命运是一首宛转的曲子，所以我们百转千折。</title>
  <desc id="desc">紫色、蓝色、粉色与暖金色渐变的中文引入句。</desc>
  <defs>
    <linearGradient id="quote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="31%" stop-color="#2563EB"/>
      <stop offset="61%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <text x="700" y="78" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="51" font-weight="700" letter-spacing="1" fill="url(#quote)">命运是一首宛转的曲子，所以我们百转千折。</text>
</svg>
